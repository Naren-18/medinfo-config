server:
  port: 8082

spring:
  datasource:
    url: ${MEDICAL_DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update

    show-sql: true

    database-platform: org.hibernate.dialect.PostgreSQLDialect

    properties:
      hibernate:
        format_sql: true

  
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}

  data:
    redis:
      host: ${REDISHOST}
      port: ${REDISPORT}
      username: ${REDISUSER}
      password: ${REDISPASSWORD}

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION}

ai:
  provider: ${AI_PROVIDER:gemini}

# ai.provider picks the PRIMARY provider. Both Gemini and the openai-compatible
# provider (below) are always active — FallbackAiSummaryService automatically
# tries whichever one isn't primary if the primary fails.
gemini:
  model: ${GEMINI_MODEL:gemini-3.1-flash-lite}

# Works for any provider that
# implements the OpenAI Chat Completions API — Groq and OpenAI both do.
# Switching provider is a config change here, not a code change:
#   Groq:   base-url=https://api.groq.com/openai/v1/chat/completions   model=llama-3.3-70b-versatile
#   OpenAI: base-url=https://api.openai.com/v1/chat/completions        model=gpt-5.4-mini
openai-compatible:
  base-url: ${OPENAI_COMPATIBLE_BASE_URL:https://api.groq.com/openai/v1/chat/completions}
  api-key: ${OPENAI_COMPATIBLE_API_KEY:}
  model: ${OPENAI_COMPATIBLE_MODEL:llama-3.3-70b-versatile}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL}
    register-with-eureka: true
    fetch-registry: true

  instance:
    prefer-ip-address: false

management:
  endpoints:
    web:
      exposure:
        include: health

  endpoint:
    health:
      show-details: always
