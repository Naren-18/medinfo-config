server:
  port: 8080

spring:
  cloud:
    gateway:
      server:
        webflux:
          routes:

            - id: auth-service
              uri: lb://AUTH-SERVICE
              predicates:
                - Path=/api/auth/**,/api/users/**

            - id: medical-service
              uri: lb://MEDICAL-SERVICE
              predicates:
                - Path=/api/profile/**,/api/contacts/**,/api/emergency/**

eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka
    register-with-eureka: true
    fetch-registry: true
management:
  endpoints:
    web:
      exposure:
        include: health

  endpoint:
    health:
      show-details: always